# CI: lint → test / validate_dag / validate_ddl (.gitlab-ci.yml 과 같은 단계)
name: ci

on:
  pull_request:
  push:
    branches: [main]

env:
  PYTHON_VERSION: "3.13"
  AIRFLOW_VERSION: "3.3.2"
  AIRFLOW__CORE__LOAD_EXAMPLES: "False"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -r requirements-dev.txt
      - run: black --check .
      - run: flake8 dags plugins scripts tests

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      # Airflow 버전 고정 (공식 constraints)
      - run: >
          pip install "apache-airflow==${AIRFLOW_VERSION}" -r custom_image/airflow/requirements.txt
          --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-${AIRFLOW_VERSION}/constraints-${PYTHON_VERSION}.txt"
      - run: pip install -r requirements-dev.txt
      - run: pytest -q tests/test_scripts.py

  validate_dag:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: >
          pip install "apache-airflow==${AIRFLOW_VERSION}" -r custom_image/airflow/requirements.txt
          --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-${AIRFLOW_VERSION}/constraints-${PYTHON_VERSION}.txt"
      - run: pip install -r requirements-dev.txt
      # DagBag import 오류 + 운영 정책 (Pool·큐·trigger_rule·max_active_runs·센서 모드)
      - run: pytest -q tests/test_dag_integrity.py

  validate_ddl:
    needs: lint
    runs-on: ubuntu-latest
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ev_platform
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: ci
      PGPASSWORD: ci
      PGDATABASE: ev_platform
    steps:
      - uses: actions/checkout@v4
      - run: psql -v ON_ERROR_STOP=1 -q -f custom_image/postgis/initdb/00_extensions_schemas.sql
      # 2회 적용: 재실행 안전성 확인
      - run: for f in files/sqls/ddl/*.sql; do psql -v ON_ERROR_STOP=1 -q -f "$f"; done
      - run: for f in files/sqls/ddl/*.sql; do psql -v ON_ERROR_STOP=1 -q -f "$f"; done
