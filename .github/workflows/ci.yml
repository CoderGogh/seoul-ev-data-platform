# CI: lint → test / validate_dag / validate_ddl (.gitlab-ci.yml 과 같은 단계)
name: ci

on:
  pull_request:
  push:
    branches: [main]

env:
  PYTHON_VERSION: "3.13"
  AIRFLOW_VERSION: "3.3.2"
  AIRFLOW__CORE__LOAD_EXAMPLES: "False"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -r requirements-dev.txt
      - run: black --check .
      - run: flake8 dags plugins scripts tests

  # 단위 테스트 + DB 통합 테스트 (빈 PostGIS 에 DDL 적용 후 게시·적재 경로 실행)
  test:
    needs: lint
    runs-on: ubuntu-latest
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ev_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: ci
      PGPASSWORD: ci
      PGDATABASE: ev_test
      EV_TEST_DB_URL: postgresql://ci:ci@localhost:5432/ev_test
    steps:
      - uses: actions/checkout@v4
      - run: psql -v ON_ERROR_STOP=1 -q -f custom_image/postgis/initdb/00_extensions_schemas.sql
      - run: for f in files/sqls/ddl/*.sql; do psql -v ON_ERROR_STOP=1 -q -f "$f"; done
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      # Airflow 버전 고정 (공식 constraints)
      - run: >
          pip install "apache-airflow==${AIRFLOW_VERSION}" -r custom_image/airflow/requirements.txt
          --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-${AIRFLOW_VERSION}/constraints-${PYTHON_VERSION}.txt"
      - run: pip install -r requirements-dev.txt
      # DAG 정책은 validate_dag 에서
      # 백업 테스트: 서버(16)와 같은 버전 pg_dump 우선
      - run: test -d /usr/lib/postgresql/16/bin && echo /usr/lib/postgresql/16/bin >> "$GITHUB_PATH" || ls /usr/lib/postgresql
      - run: pytest -q tests --ignore=tests/test_dag_integrity.py

  validate_dag:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: >
          pip install "apache-airflow==${AIRFLOW_VERSION}" -r custom_image/airflow/requirements.txt
          --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-${AIRFLOW_VERSION}/constraints-${PYTHON_VERSION}.txt"
      - run: pip install -r requirements-dev.txt
      # DagBag import 오류 + 운영 정책 (Pool·큐·trigger_rule·max_active_runs·센서 모드)
      - run: pytest -q tests/test_dag_integrity.py

  validate_ddl:
    needs: lint
    runs-on: ubuntu-latest
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ev_platform
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: ci
      PGPASSWORD: ci
      PGDATABASE: ev_platform
    steps:
      - uses: actions/checkout@v4
      - run: psql -v ON_ERROR_STOP=1 -q -f custom_image/postgis/initdb/00_extensions_schemas.sql
      # 2회 적용: 재실행 안전성 확인
      - run: for f in files/sqls/ddl/*.sql; do psql -v ON_ERROR_STOP=1 -q -f "$f"; done
      - run: for f in files/sqls/ddl/*.sql; do psql -v ON_ERROR_STOP=1 -q -f "$f"; done
      # 웹 로그인 권한 SQL (Supabase 흉내, 별도 DB)
      - run: createdb auth_test
      - run: |
          psql -v ON_ERROR_STOP=1 -q -f supabase/tests/auth_stub.sql
          for f in supabase/migrations/*.sql; do psql -v ON_ERROR_STOP=1 -q -f "$f"; done
          psql -v ON_ERROR_STOP=1 -q -f supabase/tests/auth_roles_test.sql
        env:
          PGDATABASE: auth_test
